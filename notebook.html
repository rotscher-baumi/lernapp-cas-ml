<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-en="Exercise notebook · CAS ML">Übungs-Notebook · CAS ML</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .nbbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .nbbar a{min-height:44px;display:inline-flex;align-items:center}
  #nbframe{width:100%;height:calc(100vh - 150px);min-height:480px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  #nbmiss{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="nbbar"><a href="index.html" data-en="← Back to the study guide">← Zurück zur Lernhilfe</a><a id="nbopen" target="_blank" rel="noopener" data-en="Open in a separate tab">In eigenem Tab öffnen</a></div>
<iframe id="nbframe" title="Jupyter-Notebook mit den Python-Übungen" data-en-title="Jupyter notebook with the Python exercises"></iframe>
<div id="nbmiss" class="merk" data-en="&lt;b&gt;Jupyter is not running&lt;/b&gt;&lt;p&gt;Start it in the study app folder:&lt;br&gt;&lt;code&gt;jupyter-lab --no-browser --ip=127.0.0.1 --port=8899 --ServerApp.base_url=/jupyter/ --ServerApp.token=lernapp-local&lt;/code&gt;&lt;/p&gt;"><b>Jupyter läuft nicht</b><p>Starte im Ordner der Lernapp:<br><code>jupyter-lab --no-browser --ip=127.0.0.1 --port=8899 --ServerApp.base_url=/jupyter/ --ServerApp.token=lernapp-local</code></p></div>
</div>
<script>
(function () {
  // English: ?lang=en or the stored choice from the main page swaps the [data-en] texts
  var en = /[?&]lang=en\b/.test(location.search);
  try { if (!/[?&]lang=de\b/.test(location.search) && localStorage.getItem('cas-ml-lang') === 'en') en = true; } catch (e) {}
  if (en) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach(function (el) { el.innerHTML = el.getAttribute('data-en'); });
    document.querySelectorAll('[data-en-title]').forEach(function (el) { el.title = el.getAttribute('data-en-title'); });
  }
})();
(function () {
  var url = '/jupyter/lab/tree/notebooks/Lernapp_Lernhilfe.ipynb?token=lernapp-local';
  var frame = document.getElementById('nbframe');
  frame.src = url;
  document.getElementById('nbopen').href = url;
  fetch('/jupyter/api/status?token=lernapp-local').then(function (r) {
    if (!r.ok) throw new Error(r.status);
  }).catch(function () {
    frame.style.display = 'none';
    document.getElementById('nbmiss').style.display = 'block';
  });
})();
</script>
</body>
</html>
